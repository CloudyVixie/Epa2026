<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./frontend/styles/pages/cadastro.css">
    <title>Tela Cadastro</title>
</head>
<body>
    <main class="cadastro">
        <!-- campo nome -->
        <div class="campo" id="campo-cadastro">
            <label for="nome">
                Nome
            </label>
            <input type="text" id="nome" placeholder="nome" required>
        </div>


        <!-- campo email -->
        <div class="campo" id="campo-email">
            <label for="email">
                Email
            </label>
            <input type="email" id="email" pattern="[^@\s]+@[^@\s]+\.com" placeholder="email@email.com" required>
        </div>


        <!-- campo senha -->
        <div class="campo" id="campo-senha">
            <label for="senha">
                Senha
            </label>
            <input type="password" id="senha" minlength="9" maxlength="15" placeholder="senha" required>
        </div>


        <!-- campo confirmar senha -->
        <div class="campo" id="campo-confirmar-senha">
            <label for="confirmar_senha">
                Confirmar senha
            </label>
            <input type="password" id="confirmar_senha" minlength="9" maxlength="15" placeholder="confirmar senha" required>
        </div>

        <div class="campo" id="campo-selecionar-personagem">
            <label for="personagens"> Selecione o personagem
                <select id="personagens" required>
                    
                </select>
            
            </label>
        </div>

        <button id="cadastrar">Cadastrar</button>
    </main>
    
    



    
    <script src="./backend/scripts/cadastrar.js">
        
    </script>
</body>


</html>
