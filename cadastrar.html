<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./frontend/styles/pages/cadastro.css" />
    <title>Cadastro</title>
  </head>
  <body>
    <main class="cadastro">
      <div class="campo" id="campo-cadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="name" maxlength="100" placeholder="Seu nome" required />
      </div>
      <div class="campo" id="campo-email">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="email@email.com" required />
      </div>
      <div class="campo" id="campo-senha">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="9" maxlength="72" autocomplete="new-password" placeholder="Senha" required />
      </div>
      <div class="campo" id="campo-confirmar-senha">
        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="9" maxlength="72" autocomplete="new-password" placeholder="Confirme a senha" required />
      </div>
      <div class="campo" id="campo-selecionar-personagem">
        <label for="personagens">Selecione o personagem</label>
        <select id="personagens" name="personagem_id" required>
          <option value="">Carregando personagens...</option>
        </select>
      </div>
      <button id="cadastrar" type="button">Cadastrar</button>
    </main>
    <script src="./backend/scripts/cadastrar.js"></script>
  </body>
</html>
