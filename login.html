<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./frontend/styles/pages/login.css" />
    <title>Login</title>
  </head>
  <body>
    <main>
      <div class="campo" id="campo-email">
        <label for="email">Insira o e-mail</label>
        <input
          type="email"
          id="email"
          autocomplete="email"
          placeholder="email@email.com"
          required
        />
      </div>

      <div class="campo" id="campo-senha">
        <label for="senha">Insira a senha</label>
        <input
          type="password"
          id="senha"
          autocomplete="current-password"
          minlength="9"
          required
        />
      </div>

      <button id="login" type="button">Entrar</button>
    </main>

    <script src="./backend/scripts/login.js"></script>
  </body>
</html>
