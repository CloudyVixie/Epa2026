<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./frontend/styles/pages/telaverificacao.css" />
    <title>Verificação de e-mail</title>
  </head>
  <body>
    <main>
      <h1>Confirme seu e-mail</h1>
      <p>Digite os seis números enviados para seu e-mail.</p>
      <div class="campo" id="campo-verificacao" aria-label="Código de verificação">
        <input type="text" maxlength="1" inputmode="numeric" aria-label="Primeiro dígito" />
        <input type="text" maxlength="1" inputmode="numeric" aria-label="Segundo dígito" />
        <input type="text" maxlength="1" inputmode="numeric" aria-label="Terceiro dígito" />
        <input type="text" maxlength="1" inputmode="numeric" aria-label="Quarto dígito" />
        <input type="text" maxlength="1" inputmode="numeric" aria-label="Quinto dígito" />
        <input type="text" maxlength="1" inputmode="numeric" aria-label="Sexto dígito" />
      </div>
      <p id="mensagem-verificacao" role="status" aria-live="polite"></p>
      <button id="verificar" type="button">Verificar</button>
    </main>
    <script src="./backend/scripts/verificar.js"></script>
  </body>
</html>
